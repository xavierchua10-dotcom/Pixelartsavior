<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel Rush — Story 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f4f4;
    --dim:#9fa8c9;
    --yellow:#ffce54;
    --red:#e4423f;
    --blue:#3ca7e0;
    --black:#101018;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    font-family:'VT323', monospace; color:var(--ink);
  }
  canvas{
    position:fixed; inset:0; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:-moz-crisp-edges;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 3px);
    mix-blend-mode:multiply;
  }
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.4) 100%);
  }

  .ui-layer{ position:fixed; inset:0; pointer-events:none; z-index:6; }
  .hud{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
        padding: max(14px, env(safe-area-inset-top)) 14px 0; opacity:0; transition:opacity .3s; }
  .hud.show{ opacity:1; }
  .score-label{ font-family:'Press Start 2P', monospace; font-size:9px; color:var(--dim); letter-spacing:1px; }
  .hearts{ display:flex; gap:5px; margin-top:5px; }
  .heart{ font-family:'Press Start 2P', monospace; font-size:17px; color:var(--red); text-shadow:2px 2px 0 #000; }
  .heart.lost{ color:#333; opacity:0.4; }
  .mute-btn{
    pointer-events:auto; margin-top:8px; width:34px; height:34px;
    background:var(--black); border:2px solid var(--yellow);
    color:var(--ink); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:3px 3px 0 #000;
  }
  .mute-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  .powerups{
    position:absolute; top:54px; left:0; right:0; display:flex; justify-content:center; gap:6px;
    opacity:0; transition:opacity .3s;
  }
  .powerups.show{ opacity:1; }
  .pu-badge{
    font-family:'VT323', monospace; font-size:13px; padding:2px 7px; border:2px solid #1a1a2e;
    box-shadow:2px 2px 0 #000; color:#1a1a2e;
  }
  .pu-shield{ background:var(--blue); color:#fff; }

  .boss-bar{
    position:absolute; top:90px; left:50%; transform:translateX(-50%);
    width:74%; max-width:340px; text-align:center; opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .boss-bar.show{ opacity:1; }
  .boss-label{ font-family:'Press Start 2P', monospace; font-size:11px; color:var(--red); text-shadow:2px 2px 0 #000; margin-bottom:5px; }
  .boss-track{ height:14px; border:2px solid #1a1a2e; background:#1a1a2e; box-shadow:2px 2px 0 #000; }
  .boss-fill{ height:100%; width:100%; background:var(--red); transition:width .3s ease-out; }

  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; pointer-events:none; opacity:0; transition:opacity .4s;
  }
  .panel.show{ opacity:1; pointer-events:auto; }
  .title{
    font-family:'Press Start 2P', monospace; font-size:clamp(20px,7vw,34px); line-height:1.5;
    color:var(--yellow); margin:0 0 14px; text-shadow:3px 3px 0 #000, -1px -1px 0 #b5271f;
  }
  .subtitle{ font-family:'VT323', monospace; font-size:20px; letter-spacing:1px; color:var(--dim); margin-bottom:30px; }
  .prologue{
    font-family:'VT323', monospace; font-size:17px; line-height:1.35; letter-spacing:0.5px;
    color:var(--dim); max-width:280px; margin:-16px 0 26px; font-style:italic; opacity:0.85;
  }
  .controls-row{ display:flex; gap:20px; margin-bottom:34px; flex-wrap:wrap; justify-content:center; }
  .control-chip{ display:flex; flex-direction:column; align-items:center; gap:8px; font-family:'VT323', monospace; font-size:15px; color:var(--dim); letter-spacing:1px; }
  .control-chip .glyph{
    width:42px; height:42px; background:var(--black); border:2px solid var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--blue); font-family:Arial, sans-serif;
    box-shadow:3px 3px 0 #000;
  }
  .btn{
    font-family:'Press Start 2P', monospace; font-size:14px; letter-spacing:1px;
    padding:16px 28px; border:3px solid #1a1a2e; cursor:pointer;
    background:var(--red); color:#fff; box-shadow:4px 4px 0 #1a1a2e;
  }
  .btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 #1a1a2e; }
  .hint{ position:absolute; bottom:max(20px, env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
         font-family:'VT323', monospace; font-size:16px; color:var(--dim); letter-spacing:1px; opacity:0; transition:opacity .4s; }
  .hint.show{ opacity:0.9; }

  .intro-portrait-wrap{
    width:150px; height:150px; margin-bottom:16px;
    border:3px solid var(--yellow); box-shadow:4px 4px 0 #000;
    overflow:hidden; background:#000; flex-shrink:0;
  }
  .intro-portrait{ width:100%; height:100%; object-fit:cover; object-position:50% 15%; display:block; }

  .speech-bubble{
    position:relative; max-width:320px; background:var(--black);
    border:3px solid var(--ink); box-shadow:4px 4px 0 #000;
    padding:16px 18px; margin:12px 0 28px;
  }
  .speech-bubble:before{
    content:''; position:absolute; left:50%; top:-11px; transform:translateX(-50%);
    border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:12px solid var(--ink);
  }
  .speech-text{
    font-family:'VT323', monospace; font-size:20px; line-height:1.3; color:var(--ink);
  }
  .tap-continue{
    font-family:'VT323', monospace; font-size:14px; letter-spacing:2px; color:var(--dim);
    animation:blink 1.4s steps(1) infinite; text-transform:uppercase;
  }
  @keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0.25; } }

  .countdown-overlay{
    position:fixed; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .countdown-overlay.show{ opacity:1; }
  .countdown-number{
    font-family:'Press Start 2P', monospace; font-size:clamp(48px,16vw,84px); color:var(--yellow);
    text-shadow:4px 4px 0 #000, -2px -2px 0 #b5271f;
  }

  .mini-bubble{
    position:fixed; top:50%; left:50%; z-index:7;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    width:min(80vw, 320px);
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
    transform:translate(-50%,-46%);
  }
  .mini-bubble.show{ opacity:1; transform:translate(-50%,-50%); }
  .mini-portrait{
    width:120px; height:120px; object-fit:cover; object-position:50% 15%;
    border:3px solid var(--yellow); box-shadow:4px 4px 0 #000; background:#000; margin-bottom:14px;
  }
  .mini-speech{
    position:relative; background:var(--black); border:3px solid var(--ink); box-shadow:4px 4px 0 #000;
    padding:14px 16px; max-width:100%;
  }
  .mini-speech .speech-text{ font-size:19px; }
  .mini-speech:before{
    content:''; position:absolute; left:50%; top:-11px; transform:translateX(-50%);
    border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:11px solid var(--ink);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="ui-layer">
  <div class="hud" id="hud">
    <div>
      <div class="score-label">LIVES</div>
      <div class="hearts" id="heartsRow"></div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end;">
      <button class="mute-btn" id="muteBtn">🔊</button>
    </div>
  </div>
  <div class="powerups" id="powerupBar"></div>
  <div class="boss-bar" id="bossBar">
    <div class="boss-label" id="bossLabel">BOSS</div>
    <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
  </div>

  <div class="panel show" id="introPanel">
    <div class="intro-portrait-wrap">
      <img class="intro-portrait" id="introPortrait" src="savior-1.jpg" alt="Savior">
    </div>
    <div class="speech-bubble">
      <div class="speech-text" id="introText">Where the hell am I?</div>
    </div>
    <div class="tap-continue">TAP TO CONTINUE</div>
  </div>

  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
    <div class="controls-row" id="countdownControls">
      <div class="control-chip"><div class="glyph">⇆</div>SWITCH LANE</div>
      <div class="control-chip"><div class="glyph">⇡</div>JUMP</div>
      <div class="control-chip"><div class="glyph">⇣</div>SLIDE</div>
    </div>
  </div>

  <div class="mini-bubble" id="miniBubble">
    <img class="mini-portrait" id="miniPortrait" src="savior-1.jpg" alt="Savior">
    <div class="mini-speech"><div class="speech-text" id="miniText"></div></div>
  </div>

  <div class="panel" id="overPanel">
    <div class="title" style="font-size:clamp(18px,6vw,26px); color:var(--red); text-shadow:3px 3px 0 #000;">GAME OVER</div>
    <button class="btn" id="retryBtn">RUN AGAIN</button>
  </div>

  <div class="panel" id="victoryPanel">
    <div class="title" style="color:var(--yellow); text-shadow:3px 3px 0 #000, -1px -1px 0 #b5271f;">THE END</div>
    <div class="subtitle" style="margin-bottom:10px;">The tracks fall silent. Go home, Savior.</div>
    <button class="btn" id="victoryRetryBtn">RUN AGAIN</button>
  </div>

  <div class="hint" id="hint">swipe or use arrow keys</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Low-res canvas setup ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var iW = 0, iH = 0;
  var INTERNAL_H = 300;

  function resize(){
    var cssW = window.innerWidth, cssH = window.innerHeight;
    var pixelScale = cssH / INTERNAL_H;
    iH = INTERNAL_H;
    iW = Math.round(cssW / pixelScale);
    canvas.width = iW;
    canvas.height = iH;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- DOM refs ----------
  var hud = document.getElementById('hud');
  var heartsRow = document.getElementById('heartsRow');
  var introPanel = document.getElementById('introPanel');
  var introPortrait = document.getElementById('introPortrait');
  var introText = document.getElementById('introText');
  var countdownOverlay = document.getElementById('countdownOverlay');
  var countdownNumber = document.getElementById('countdownNumber');
  var miniBubble = document.getElementById('miniBubble');
  var miniPortrait = document.getElementById('miniPortrait');
  var miniText = document.getElementById('miniText');
  var overPanel = document.getElementById('overPanel');
  var victoryPanel = document.getElementById('victoryPanel');
  var victoryRetryBtn = document.getElementById('victoryRetryBtn');
  var retryBtn = document.getElementById('retryBtn');
  var muteBtn = document.getElementById('muteBtn');
  var hint = document.getElementById('hint');
  var powerupBar = document.getElementById('powerupBar');
  var bossBar = document.getElementById('bossBar');
  var bossFill = document.getElementById('bossFill');
  var bossLabel = document.getElementById('bossLabel');

  // ---------- Audio (chiptune-style) ----------
  var audioCtx = null;
  var muted = false;
  var beatTimer = null;

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq,duration,type,gainVal,when,glideTo){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime + (when||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, t);
    if(glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t+duration);
    gain.gain.setValueAtTime(gainVal||0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+duration+0.05);
  }

  function noiseHit(duration,gainVal,when,filterFreq){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime + (when||0);
    var bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate*duration));
    var buffer = audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    var src = audioCtx.createBufferSource(); src.buffer = buffer;
    var filt = audioCtx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value = filterFreq||4000;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainVal||0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    src.connect(filt).connect(gain).connect(audioCtx.destination);
    src.start(t);
  }

  function playJump(){ tone(220,0.14,'square',0.15,0,660); }
  function playCrash(){ noiseHit(0.3,0.4,0,700); tone(80,0.35,'square',0.26,0,30); }
  function playHurt(){ noiseHit(0.16,0.3,0,900); tone(140,0.2,'square',0.22,0,70); }
  function playPowerup(){ tone(660,0.08,'square',0.18,0); tone(880,0.08,'square',0.16,0.06); tone(1100,0.10,'square',0.14,0.12); }
  function playShieldBreak(){ noiseHit(0.2,0.3,0,600); tone(150,0.2,'square',0.28,0,50); }
  function playBossStart(){ tone(90,0.35,'sawtooth',0.3,0,42); noiseHit(0.3,0.3,0.08,500); }
  function playBossDefeat(){
    tone(440,0.12,'square',0.2,0); tone(554,0.12,'square',0.18,0.12);
    tone(659,0.14,'square',0.18,0.24); tone(880,0.24,'square',0.22,0.36);
  }
  function playPlasmaFire(){
    tone(1200,0.14,'sawtooth',0.22,0,300);
    noiseHit(0.1,0.2,0,3000);
  }
  function playThunder(){ noiseHit(0.45,0.22,0,260); }
  function playVictory(){
    tone(523.25,0.3,'square',0.2,0);
    tone(659.25,0.3,'square',0.18,0.15);
    tone(783.99,0.3,'square',0.18,0.3);
    tone(1046.50,0.5,'square',0.22,0.45);
  }

  // ---- soundtrack: kick / 808 bass / pad chords / claps / hats ----
  function playKick(hard){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(45, t+0.09);
    gain.gain.setValueAtTime(hard ? 0.42 : 0.35, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.25);
    if(hard){
      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(65, t);
      osc2.frequency.exponentialRampToValueAtTime(32, t+0.16);
      gain2.gain.setValueAtTime(0.22, t);
      gain2.gain.exponentialRampToValueAtTime(0.001, t+0.32);
      osc2.connect(gain2).connect(audioCtx.destination);
      osc2.start(t); osc2.stop(t+0.34);
    }
  }

  function playBass808(freq, duration, gainVal, waveType){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = waveType||'sine';
    osc.frequency.setValueAtTime(freq*2.1, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t+0.1);
    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+duration+0.05);
  }

  function playPad(freqs, duration, gainVal, dark){
    if(muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = dark ? 520 : 1100;
    filter.Q.value = dark ? 1.4 : 0.6;
    var master = audioCtx.createGain();
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(gainVal, t+0.35);
    master.gain.linearRampToValueAtTime(0, t+duration);
    filter.connect(master).connect(audioCtx.destination);
    freqs.forEach(function(f){
      var osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = f;
      osc.connect(filter);
      osc.start(t); osc.stop(t+duration+0.05);
    });
  }

  function playClap(){
    noiseHit(0.05,0.26,0,2200);
    noiseHit(0.09,0.20,0.02,2000);
  }

  function playArp(freq){
    tone(freq, 0.09, 'square', 0.10, 0);
    tone(freq, 0.09, 'square', 0.05, STEP_DUR*0.5);
  }

  function playChirp(){
    if(muted || !audioCtx) return;
    var base = 1800+Math.random()*800;
    tone(base, 0.06, 'sine', 0.05, 0, base*1.4);
  }

  function playWarningSiren(){
    tone(440,0.18,'sawtooth',0.2,0,880);
    tone(880,0.18,'sawtooth',0.14,0.18,440);
  }

  var THEME = 'city'; // 'city' | 'forest' | 'cyberpunk'

  var CHORDS = [
    { bass:55.00, pad:[110.00,130.81,164.81] }, // A minor
    { bass:43.65, pad:[87.31,110.00,130.81] },  // F major
    { bass:65.41, pad:[130.81,164.81,196.00] }, // C major
    { bass:49.00, pad:[98.00,123.47,146.83] }   // G major
  ];
  var FOREST_CHORDS = [
    { bass:65.41, pad:[130.81,164.81,196.00] }, // C major
    { bass:98.00, pad:[196.00,246.94,293.66] }, // G major
    { bass:55.00, pad:[110.00,130.81,164.81] }, // A minor
    { bass:87.31, pad:[174.61,220.00,261.63] }  // F major
  ];
  var BOSS_CHORDS = [
    { bass:55.00, pad:[110.00,164.81], arp:[220.00,329.63,440.00,329.63] }, // A5 power chord
    { bass:49.00, pad:[98.00,146.83], arp:[196.00,293.66,392.00,293.66] },  // G5 power chord
    { bass:43.65, pad:[87.31,130.81], arp:[174.61,261.63,349.23,261.63] },  // F5 power chord
    { bass:55.00, pad:[110.00,130.81], arp:[220.00,261.63,220.00,196.00] } // A minor resolve
  ];
  var BPM = 128;
  var STEP_DUR = 60/BPM/4;
  var seqStep = 0, seqBar = 0;
  var musicMode = 'normal';

  function scheduleStep(){
    if(!muted){
      var boss = musicMode === 'boss';
      var dark = boss || THEME === 'cyberpunk';
      var chordTable = dark ? BOSS_CHORDS : (THEME === 'forest' ? FOREST_CHORDS : CHORDS);
      var chord = chordTable[seqBar % 4];
      if(seqStep % 4 === 0) playKick(boss);
      if(seqStep === 0){
        var bassGain = dark ? 0.3 : (THEME === 'forest' ? 0.22 : 0.26);
        var bassWave = dark ? 'sawtooth' : (THEME === 'forest' ? 'triangle' : 'sine');
        playBass808(chord.bass, 0.5, bassGain, bassWave);
        playPad(chord.pad, STEP_DUR*16, dark ? 0.06 : 0.045, dark);
      }
      if(seqStep === 4 || seqStep === 12) playClap();
      var hatGain = (seqStep % 4 === 2) ? 0.09 : 0.05;
      noiseHit(0.035, hatGain, 0, dark ? 6500 : 7500);
      if(dark && chord.arp && seqStep % 2 === 0){
        playArp(chord.arp[(seqStep/2) % chord.arp.length]);
      }
      if(seqStep === 14 && (dark || seqBar % 2 === 1)){
        noiseHit(0.02,0.05,0,7500);
        noiseHit(0.02,0.05,STEP_DUR*0.33,7500);
        noiseHit(0.02,0.05,STEP_DUR*0.66,7500);
      }
      if(THEME === 'forest' && !boss && Math.random() < 0.05){
        playChirp();
      }
    }
    seqStep = (seqStep+1) % 16;
    if(seqStep === 0) seqBar = (seqBar+1) % 4;
  }

  function startBeat(){
    stopBeat();
    seqStep = 0; seqBar = 0;
    musicMode = 'normal';
    beatTimer = setInterval(scheduleStep, STEP_DUR*1000);
  }
  function stopBeat(){ if(beatTimer){ clearInterval(beatTimer); beatTimer=null; } }

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- Game constants ----------
  var LANES = [-1,0,1];
  var JUMP_DURATION = 0.52;
  var SLIDE_DURATION = 0.46;
  var LANE_LERP_RATE = 11;

  // ---------- Game state ----------
  var state = 'start'; // start | playing | gameover
  var player, obstacles, coins, particles, poles, powerUps;
  var distance, speed, difficulty, spawnTimer, poleTimer, powerupTimer, runCycle, cloudT;
  var activeEffects, lives, invulnTimer, hitFlashAlpha;

  var FIRST_BOSS_DISTANCE = 3200;
  var BOSS_INTERVAL = 3600;
  var BOSS_LANE_LERP = 3.2;
  var ENDING_DURATION = 9;
  var TOTAL_BOSSES = 1;
  var STORY_BOSS_INDEX = 0;
  var BOSS_TYPES = [
    { name:'SENTRY', beamCount:1, chargeMin:0.5, chargeMax:0.9, cooldownMin:0.4, cooldownMax:0.9,
      colorA:'#ff2fd6', colorB:'#34e0ff', hull:'#7a1420', thruster:'#4a1620', eye:'rgba(255,90,100,' },
    { name:'REAPER', beamCount:2, chargeMin:0.45, chargeMax:0.75, cooldownMin:0.35, cooldownMax:0.7,
      colorA:'#ff8a2f', colorB:'#ffce54', hull:'#7a4a14', thruster:'#4a2e0c', eye:'rgba(255,170,60,' },
    { name:'OVERLORD', beamCount:2, chargeMin:0.32, chargeMax:0.55, cooldownMin:0.28, cooldownMax:0.5,
      colorA:'#b026ff', colorB:'#ffffff', hull:'#3a1470', thruster:'#220c48', eye:'rgba(220,150,255,' }
  ];
  var BOSS_HEALTH = [6, 8, 10];
  var BOSS_TAUNTS = ["It's found you again.", "You shouldn't have come this far.", "Every runner reaches me eventually."];
  var bossActive, bossHealth, bossMaxHealth, nextBossDistance, finalBossDefeated;
  var bossWarningTimer, bossWarningShown, bossWarningLabel, bossTaunt, bossDefeatFlashTimer, bossEncounterCount, bossTypeIndex;
  var bossSirenTimer;
  var bossLaneVisual, bossHoverTarget, bossPhase, bossPhaseTimer, bossTargetLanes, bossBeamLanes, bossBeamColor;
  var nightFactor, flashTimer, flashAlpha;
  var endingActive, endingTimer;

  function reset(){
    player = { lane:0, visualLane:0, jumping:false, jumpT:0, sliding:false, slideT:0 };
    obstacles = [];
    coins = [];
    particles = [];
    poles = [];
    powerUps = [];
    distance = 0; speed = 0.55; difficulty = 0;
    spawnTimer = 0.6; poleTimer = 0; powerupTimer = 9+Math.random()*6; runCycle = 0;
    activeEffects = { shield:0 };
    lives = 3; invulnTimer = 0; hitFlashAlpha = 0;
    bossActive = false; bossHealth = 0; bossMaxHealth = 6; finalBossDefeated = false;
    nextBossDistance = FIRST_BOSS_DISTANCE;
    bossWarningTimer = 0; bossWarningShown = false; bossWarningLabel = 'BOSS INCOMING';
    bossTaunt = '';
    bossSirenTimer = 0;
    bossDefeatFlashTimer = 0; bossEncounterCount = 0; bossTypeIndex = 0;
    bossLaneVisual = 0; bossHoverTarget = 0; bossPhase = 'moving'; bossPhaseTimer = 0;
    bossTargetLanes = [0]; bossBeamLanes = []; bossBeamColor = '#ff2fd6';
    nightFactor = 0; flashTimer = 2+Math.random()*2; flashAlpha = 0;
    endingActive = false; endingTimer = 0;
  }
  reset();
  cloudT = 0;

  // ---------- Parallax skyline ----------
  var buildings = [];
  (function initBuildings(){
    var count = 9;
    for(var bi=0; bi<count; bi++){
      var fw = 0.05+Math.random()*0.09;
      var fh = 0.28+Math.random()*0.6;
      var fx = bi/count + (Math.random()*0.06-0.03);
      var windows = [];
      var cols = 2+Math.floor(Math.random()*2);
      var rows = 3+Math.floor(Math.random()*4);
      for(var wc=0; wc<cols; wc++){
        for(var wr=0; wr<rows; wr++){
          if(Math.random()<0.35) windows.push({ cx:(wc+0.5)/cols, cy:(wr+0.5)/rows });
        }
      }
      buildings.push({ fx:fx, fw:fw, fh:fh, windows:windows });
    }
  })();

  // ---------- Perspective helpers ----------
  function ease(z){ return z*z; }
  function horizonY(){ return iH*0.36; }
  function groundY(){ return iH; }
  function roadTopHalf(){ return iW*0.07; }
  function roadBottomHalf(){ return iW*0.46; }
  function halfWidthAt(z){ return roadTopHalf() + (roadBottomHalf()-roadTopHalf())*ease(z); }
  function laneWidthAt(z){ return halfWidthAt(z) * (2/3); }
  function yAt(z){ return horizonY() + (groundY()-horizonY())*ease(z); }
  function laneCenterX(lane, z){ return iW/2 + lane * laneWidthAt(z); }
  function scaleAt(z){ return 0.12 + 0.88*ease(z); }

  // ---------- Input ----------
  function setLane(delta){
    player.lane = Math.max(-1, Math.min(1, player.lane + delta));
  }
  function doJump(){
    if(state!=='playing') return;
    if(!player.jumping && !player.sliding){ player.jumping = true; player.jumpT = 0; playJump(); }
  }
  function doSlide(){
    if(state!=='playing') return;
    if(!player.sliding && !player.jumping){ player.sliding = true; player.slideT = 0; }
  }

  var touchX0=0, touchY0=0;
  canvas.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchX0 = t.clientX; touchY0 = t.clientY;
  }, {passive:true});

  canvas.addEventListener('touchend', function(e){
    e.preventDefault();
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX0, dy = t.clientY - touchY0;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    if(state !== 'playing') return;
    if(Math.max(adx,ady) < 24){ doJump(); return; }
    if(adx > ady){ setLane(dx>0?1:-1); }
    else{ if(dy<0) doJump(); else doSlide(); }
  }, {passive:false});

  window.addEventListener('keydown', function(e){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)!==-1) e.preventDefault();
    if(state!=='playing') return;
    if(e.key==='ArrowLeft'||e.key==='a') setLane(-1);
    else if(e.key==='ArrowRight'||e.key==='d') setLane(1);
    else if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') doJump();
    else if(e.key==='ArrowDown'||e.key==='s') doSlide();
  }, {passive:false});

  // ---------- Wave patterns ----------
  function randLane(){ return LANES[Math.floor(Math.random()*3)]; }

  var patterns = [
    function(){ return [{lane:randLane(), type:'barrier'}]; },
    function(){ return [{lane:randLane(), type:'beam'}]; },
    function(){ return [{lane:randLane(), type:'train'}]; },
    function(){
      var open = randLane();
      return LANES.filter(function(l){ return l!==open; }).map(function(l){ return {lane:l, type:'train'}; });
    },
    function(){
      var l1 = randLane(), l2;
      do{ l2 = randLane(); }while(l2===l1);
      return [{lane:l1,type:'train'},{lane:l2,type:'barrier'}];
    },
    function(){
      var l1 = randLane(), l2;
      do{ l2 = randLane(); }while(l2===l1);
      return [{lane:l1,type:'train'},{lane:l2,type:'beam'}];
    }
  ];

  function pickPattern(diff){
    var pool = [0,1,2];
    if(diff > 0.15) pool.push(3);
    if(diff > 0.4) pool.push(4,5);
    var idx = pool[Math.floor(Math.random()*pool.length)];
    return patterns[idx]();
  }

  function approachTime(diff){ return 2.0 - 0.9*diff; }

  function pickTargetLanes(count){
    var shuffled = LANES.slice().sort(function(){ return Math.random()-0.5; });
    return shuffled.slice(0, count);
  }
  function avgLane(arr){
    var sum = 0;
    arr.forEach(function(l){ sum += l; });
    return sum/arr.length;
  }

  function spawnWave(){
    var items = pickPattern(difficulty);
    var rate = 1/approachTime(difficulty);
    items.forEach(function(it){
      obstacles.push({ lane:it.lane, type:it.type, z:0, rate:rate, checked:false });
    });
  }

  function spawnPole(){
    var side = Math.random()<0.5 ? -1 : 1;
    var rate = 1/approachTime(difficulty);
    poles.push({ side:side, z:0, rate:rate });
  }

  function spawnPowerUp(){
    var lane = randLane();
    var rate = 1/approachTime(difficulty);
    powerUps.push({ lane:lane, type:'shield', z:0, rate:rate, collected:false });
  }

  // ---------- Particles ----------
  function burst(x,y,color,count){
    for(var i=0;i<count;i++){
      var a = Math.random()*Math.PI*2;
      var sp = 30+Math.random()*90;
      particles.push({ x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.4+Math.random()*0.25, maxLife:0.65, color:color });
    }
  }

  // ---------- Game flow ----------
  function startGame(){
    ensureAudio();
    reset();
    state = 'playing';
    overPanel.classList.remove('show');
    victoryPanel.classList.remove('show');
    hud.classList.add('show');
    powerupBar.classList.add('show');
    bossBar.classList.remove('show');
    updateHeartsHUD();
    hint.classList.add('show');
    setTimeout(function(){ hint.classList.remove('show'); }, 2600);
    startBeat();
  }

  function gameOver(){
    state = 'gameover';
    stopBeat();
    playCrash();
    hud.classList.remove('show');
    powerupBar.classList.remove('show');
    bossBar.classList.remove('show');
    setTimeout(function(){ overPanel.classList.add('show'); }, 300);
  }

  function finishGame(){
    state = 'ended';
    stopBeat();
    playVictory();
    hud.classList.remove('show');
    powerupBar.classList.remove('show');
    setTimeout(function(){ victoryPanel.classList.add('show'); }, 400);
  }

  function updateHeartsHUD(){
    var html = '';
    for(var i=0;i<3;i++){
      html += '<span class="heart' + (i<lives?'':' lost') + '">\u2665</span>';
    }
    heartsRow.innerHTML = html;
  }

  function takeHit(x, y){
    if(activeEffects.shield>0){
      activeEffects.shield = 0;
      playShieldBreak();
      burst(x,y,'#3ca7e0',14);
      return;
    }
    if(invulnTimer>0) return;
    lives--;
    invulnTimer = 1.2;
    hitFlashAlpha = 0.45;
    updateHeartsHUD();
    playHurt();
    burst(x,y,'#e4423f',10);
    if(lives<=0) gameOver();
  }

  // ---------- Opening cutscene ----------
  var introLines = [
    { img:'savior-1.jpg', text:"Where the hell am I?" },
    { img:'savior-2.jpg', text:"I am lost for real, where is this place..." },
    { img:'savior-1.jpg', text:"Why are the streets empty right now, it's daytime... wth.." },
    { img:'savior-3.jpg', text:"I better keep running right now." }
  ];
  var introIndex = 0;

  function showIntroLine(i){
    introPortrait.src = introLines[i].img;
    introText.textContent = introLines[i].text;
  }
  showIntroLine(0);

  function advanceIntro(){
    ensureAudio();
    introIndex++;
    if(introIndex < introLines.length){
      showIntroLine(introIndex);
    } else {
      introPanel.classList.remove('show');
      runCountdown();
    }
  }
  introPanel.addEventListener('click', advanceIntro);

  function runCountdown(){
    countdownOverlay.classList.add('show');
    var n = 3;
    countdownNumber.textContent = n;
    var iv = setInterval(function(){
      n--;
      if(n > 0){
        countdownNumber.textContent = n;
      } else {
        clearInterval(iv);
        countdownOverlay.classList.remove('show');
        startGame();
      }
    }, 700);
  }

  // ---------- Mini narrator bubble (boss warning / ending) ----------
  var miniBubbleTimer = null;
  function showMiniDialogue(lines){
    clearTimeout(miniBubbleTimer);
    var i = 0;
    function showNext(){
      if(i >= lines.length){
        miniBubble.classList.remove('show');
        return;
      }
      miniPortrait.src = lines[i].img;
      miniText.textContent = lines[i].text;
      miniBubble.classList.add('show');
      i++;
      miniBubbleTimer = setTimeout(showNext, lines[i-1].hold || 2200);
    }
    showNext();
  }

  retryBtn.addEventListener('click', startGame);
  victoryRetryBtn.addEventListener('click', startGame);

  // ---------- Update ----------
  function updatePowerupHUD(){
    var html = '';
    if(activeEffects.shield>0) html += '<div class="pu-badge pu-shield">SHIELD '+activeEffects.shield.toFixed(1)+'s</div>';
    powerupBar.innerHTML = html;
  }

  function update(dt){
    if(state !== 'playing') return;

    distance += speed*dt*140;
    difficulty = Math.min(1, distance/4200);
    speed = 0.55 + 0.7*difficulty;
    runCycle += dt*(6+8*speed);

    if(player.jumping){
      player.jumpT += dt;
      if(player.jumpT >= JUMP_DURATION){ player.jumping=false; player.jumpT=0; }
    }
    if(player.sliding){
      player.slideT += dt;
      if(player.slideT >= SLIDE_DURATION){ player.sliding=false; player.slideT=0; }
    }
    player.visualLane += (player.lane - player.visualLane) * Math.min(1, LANE_LERP_RATE*dt);

    // power-up timers
    if(activeEffects.shield>0){
      activeEffects.shield -= dt;
      if(activeEffects.shield<0) activeEffects.shield=0;
    }

    // invulnerability / hit feedback decay
    if(invulnTimer>0){
      invulnTimer -= dt;
      if(invulnTimer<0) invulnTimer=0;
    }
    if(hitFlashAlpha>0){
      hitFlashAlpha -= dt*2;
      if(hitFlashAlpha<0) hitFlashAlpha=0;
    }

    // ---- night / flash atmosphere ----
    var bossEventActive = bossWarningTimer>0 || bossActive;
    var nightTarget = bossEventActive ? 1 : 0;
    nightFactor += (nightTarget - nightFactor) * Math.min(1, dt*1.4);
    if(nightFactor<0.001) nightFactor=0;
    if(nightFactor>0.999) nightFactor=1;

    var wantedMusicMode = bossActive ? 'boss' : 'normal';
    if(wantedMusicMode !== musicMode){
      musicMode = wantedMusicMode;
      seqStep = 0; seqBar = 0;
    }

    if(bossEventActive){
      flashTimer -= dt;
      if(flashTimer<=0){
        flashAlpha = 0.3+Math.random()*0.25;
        flashTimer = 1.6+Math.random()*2.4;
        if(Math.random()<0.5) playThunder();
      }
    }
    if(flashAlpha>0){
      flashAlpha -= dt*2.2;
      if(flashAlpha<0) flashAlpha=0;
    }

    // ---- boss fight ----
    if(bossWarningTimer>0){
      bossWarningTimer -= dt;
      if(bossWarningTimer<0) bossWarningTimer=0;
      bossSirenTimer -= dt;
      if(bossSirenTimer<=0){
        playWarningSiren();
        bossSirenTimer = 0.7;
      }
    }
    if(bossDefeatFlashTimer>0){
      bossDefeatFlashTimer -= dt;
      if(bossDefeatFlashTimer<0) bossDefeatFlashTimer=0;
    }

    if(!bossActive && !finalBossDefeated){
      if(distance >= nextBossDistance){
        bossActive = true;
        bossEncounterCount++;
        bossTypeIndex = STORY_BOSS_INDEX;
        var startBt = BOSS_TYPES[bossTypeIndex];
        bossMaxHealth = BOSS_HEALTH[bossTypeIndex];
        bossHealth = bossMaxHealth;
        obstacles = []; coins = []; powerUps = [];
        bossWarningTimer = 0; bossWarningShown = false;
        bossTargetLanes = pickTargetLanes(startBt.beamCount);
        bossHoverTarget = avgLane(bossTargetLanes);
        bossLaneVisual = player.lane;
        bossPhase = 'moving'; bossPhaseTimer = 0;
        bossLabel.textContent = startBt.name;
        bossBar.classList.add('show');
        bossFill.style.width = '100%';
        playBossStart();
      } else if(!bossWarningShown && nextBossDistance - distance < 650){
        bossWarningShown = true;
        bossWarningTimer = 2.6;
        bossSirenTimer = 0;
        obstacles = []; coins = []; powerUps = [];
        var upcomingIdx = STORY_BOSS_INDEX;
        bossWarningLabel = BOSS_TYPES[upcomingIdx].name + ' INCOMING';
        bossTaunt = BOSS_TAUNTS[upcomingIdx];
        showMiniDialogue([
          { img:'savior-1.jpg', text:"Umm, the atmosphere is different..." },
          { img:'savior-3.jpg', text:"Impossible....wth are you..." }
        ]);
      }
    } else if(bossActive){
      var bt = BOSS_TYPES[bossTypeIndex];
      bossLaneVisual += (bossHoverTarget - bossLaneVisual) * Math.min(1, BOSS_LANE_LERP*dt);

      if(bossPhase === 'moving'){
        if(Math.abs(bossLaneVisual-bossHoverTarget) < 0.04){
          bossPhase = 'charging';
          bossPhaseTimer = bt.chargeMin + Math.random()*(bt.chargeMax-bt.chargeMin);
        }
      } else if(bossPhase === 'charging'){
        bossPhaseTimer -= dt;
        if(bossPhaseTimer <= 0){
          bossPhase = 'firing';
          bossPhaseTimer = 0.16;
          bossBeamLanes = bossTargetLanes.slice();
          bossBeamColor = Math.random()<0.5 ? bt.colorA : bt.colorB;
          playPlasmaFire();
          if(bossBeamLanes.indexOf(player.lane) !== -1){
            var bsx = laneCenterX(player.visualLane,1), bsy = groundY()-iH*0.1;
            takeHit(bsx, bsy);
          }
        }
      } else if(bossPhase === 'firing'){
        bossPhaseTimer -= dt;
        if(bossPhaseTimer <= 0){
          bossPhase = 'cooldown';
          bossPhaseTimer = bt.cooldownMin + Math.random()*(bt.cooldownMax-bt.cooldownMin);
        }
      } else if(bossPhase === 'cooldown'){
        bossPhaseTimer -= dt;
        if(bossPhaseTimer <= 0){
          bossHealth--;
          bossFill.style.width = Math.max(0, (bossHealth/bossMaxHealth*100)) + '%';
          if(bossHealth <= 0){
            bossActive = false;
            bossDefeatFlashTimer = 1.6;
            bossBar.classList.remove('show');
            playBossDefeat();
            if(bossEncounterCount >= TOTAL_BOSSES){
              finalBossDefeated = true;
              obstacles = []; coins = []; powerUps = [];
              endingActive = true;
              endingTimer = ENDING_DURATION;
              showMiniDialogue([
                { img:'savior-3.jpg', text:"Sh*t...it makes me tired, please stop...", hold:4000 }
              ]);
            } else {
              nextBossDistance = distance + BOSS_INTERVAL;
            }
          } else {
            bossTargetLanes = pickTargetLanes(bt.beamCount);
            bossHoverTarget = avgLane(bossTargetLanes);
            bossPhase = 'moving';
          }
        }
      }
    }

    if(endingActive){
      endingTimer -= dt;
      speed = Math.max(0.32, speed - dt*0.14);
      if(endingTimer <= 0){
        endingActive = false;
        finishGame();
      }
    }

    if(!bossActive && !endingActive && !bossWarningShown){
      spawnTimer -= dt;
      if(spawnTimer <= 0){
        spawnWave();
        spawnTimer = (1.5 - 0.65*difficulty) + (Math.random()*0.3-0.15);
      }
      powerupTimer -= dt;
      if(powerupTimer <= 0){
        spawnPowerUp();
        powerupTimer = 14+Math.random()*8;
      }
    }
    poleTimer -= dt;
    if(poleTimer <= 0){
      spawnPole();
      poleTimer = 0.35;
    }

    var i;
    for(i=obstacles.length-1;i>=0;i--){
      var o = obstacles[i];
      o.z += o.rate*dt;
      if(!o.checked && o.z >= 0.93){
        o.checked = true;
        if(o.lane === player.lane){
          var hit = true;
          if(o.type==='barrier' && player.jumping) hit = false;
          if(o.type==='beam' && player.sliding) hit = false;
          if(hit){
            var sx = laneCenterX(player.visualLane,1), sy = groundY()-iH*0.1;
            takeHit(sx, sy);
          }
        }
      }
      if(o.z > 1.2) obstacles.splice(i,1);
    }

    for(i=powerUps.length-1;i>=0;i--){
      var pu = powerUps[i];
      pu.z += pu.rate*dt;
      if(!pu.collected && pu.z >= 0.9 && pu.z <= 1.06 && pu.lane === player.lane){
        pu.collected = true;
        activeEffects.shield = 10;
        var px = laneCenterX(player.visualLane,1), py = groundY()-iH*0.08;
        burst(px,py,'#3ca7e0',12);
        playPowerup();
      }
      if(pu.z > 1.2) powerUps.splice(i,1);
    }

    for(i=poles.length-1;i>=0;i--){
      poles[i].z += poles[i].rate*dt;
      if(poles[i].z > 1.2) poles.splice(i,1);
    }

    for(i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 220*dt;
      if(p.life<=0) particles.splice(i,1);
    }

    updatePowerupHUD();
  }

  // ---------- Render helpers: pixel sprites ----------
  function hexToRgb(hex){
    var num = parseInt(hex.replace('#',''),16);
    return [(num>>16)&255, (num>>8)&255, num&255];
  }
  function lerpColor(hexA,hexB,t){
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    var r = Math.round(a[0]+(b[0]-a[0])*t);
    var g = Math.round(a[1]+(b[1]-a[1])*t);
    var bl = Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }

  function shadeColor(hex, factor){
    var rgb = hexToRgb(hex);
    var r = Math.max(0,Math.min(255,Math.round(rgb[0]*factor)));
    var g = Math.max(0,Math.min(255,Math.round(rgb[1]*factor)));
    var b = Math.max(0,Math.min(255,Math.round(rgb[2]*factor)));
    return 'rgb('+r+','+g+','+b+')';
  }
  function drawGroundShadow(x, y, halfW, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(2,halfW), Math.max(1,halfW*0.32), 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawPixelSun(cx,cy,r,color){
    ctx.fillStyle = color;
    var w1 = r*1.2, w2 = r*1.9;
    ctx.fillRect(Math.round(cx-w1/2), Math.round(cy-r), Math.round(w1), Math.round(r*0.45));
    ctx.fillRect(Math.round(cx-w2/2), Math.round(cy-r*0.55), Math.round(w2), Math.round(r*1.1));
    ctx.fillRect(Math.round(cx-w1/2), Math.round(cy+r*0.55), Math.round(w1), Math.round(r*0.45));
  }

  function drawCloud(cx,cy,r,alpha){
    ctx.fillStyle = 'rgba(255,255,255,'+alpha.toFixed(2)+')';
    ctx.fillRect(Math.round(cx-r*1.6), Math.round(cy-r*0.4), Math.round(r*3.2), Math.round(r*0.8));
    ctx.fillRect(Math.round(cx-r*0.9), Math.round(cy-r*0.9), Math.round(r*1.8), Math.round(r*0.7));
    ctx.fillRect(Math.round(cx+r*0.3), Math.round(cy-r*0.7), Math.round(r*1.4), Math.round(r*0.6));
  }

  var stars = [];
  (function initStars(){
    for(var i=0;i<50;i++){
      stars.push({ fx:Math.random(), fy:Math.random()*0.7, r:Math.random()*1.2+0.5, phase:Math.random()*Math.PI*2 });
    }
  })();

  function drawSkyline(){
    var hy = horizonY();
    var tileW = iW*0.55;
    var scrollOffset = (distance*0.05) % tileW;
    var maxH = hy*0.55;
    for(var rep=-1; rep<=1; rep++){
      var baseX = rep*tileW - scrollOffset;
      for(var bi=0; bi<buildings.length; bi++){
        var b = buildings[bi];
        var bx = baseX + b.fx*tileW;
        var bw = b.fw*tileW;
        var bh = b.fh*maxH;
        var by = hy-bh;
        if(THEME === 'forest'){
          ctx.fillStyle = '#1f3a24';
          ctx.beginPath();
          ctx.moveTo(bx+bw/2, by);
          ctx.lineTo(bx, hy+1);
          ctx.lineTo(bx+bw, hy+1);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#4a4560';
          ctx.fillRect(Math.round(bx), Math.round(by), Math.round(bw), Math.round(bh)+2);
          ctx.fillStyle = '#ffe9a8';
          for(var wi=0; wi<b.windows.length; wi++){
            var w = b.windows[wi];
            var wx = bx + w.cx*bw, wy = by + w.cy*bh;
            ctx.fillRect(Math.round(wx-1), Math.round(wy-1), 2, 2);
          }
        }
      }
    }
  }

  function drawSky(){
    var hy = horizonY();
    var dayBands = THEME === 'forest'
      ? ['#4a90d9','#79b8e8','#a8d4c8','#dcefd0']
      : ['#3a6fb5','#5f9bdc','#8ec3ec','#bfe2f7'];
    var nightBands = ['#05040d','#0d0a1f','#161233','#241a3a'];
    var stops = [0.0, 0.34, 0.62, 0.85];
    var skyGrad = ctx.createLinearGradient(0, 0, 0, hy);
    for(var bi=0; bi<stops.length; bi++){
      skyGrad.addColorStop(stops[bi], lerpColor(dayBands[bi], nightBands[bi], nightFactor));
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, iW, Math.ceil(hy)+1);

    if(nightFactor>0.02){
      var starAlphaBase = nightFactor;
      var t = performance.now()/1000;
      for(var si=0; si<stars.length; si++){
        var st = stars[si];
        var tw = 0.4+0.5*Math.sin(t*1.4+st.phase);
        ctx.fillStyle = 'rgba(244,238,255,'+Math.max(0,(tw*starAlphaBase)).toFixed(2)+')';
        ctx.fillRect(Math.round(st.fx*iW), Math.round(st.fy*hy), Math.max(1,st.r), Math.max(1,st.r));
      }
    }

    var sunColor = lerpColor('#ffce54', '#d7dcef', nightFactor);
    drawPixelSun(iW*0.16, hy*0.24, iH*0.05, sunColor);
    var cloudAlpha = 0.85*(1-nightFactor*0.7);
    drawCloud(((cloudT*6) % (iW+50))-25, hy*0.16, iH*0.03, cloudAlpha);
    drawCloud(((cloudT*4 + iW*0.5) % (iW+70))-35, hy*0.34, iH*0.04, cloudAlpha);
    drawSkyline();
  }

  function drawRoad(){
    var hy = horizonY(), gy = groundY();
    var topH = roadTopHalf(), botH = roadBottomHalf();
    var isForest = THEME === 'forest';

    ctx.beginPath();
    ctx.moveTo(iW/2-topH, hy);
    ctx.lineTo(iW/2+topH, hy);
    ctx.lineTo(iW/2+botH, gy);
    ctx.lineTo(iW/2-botH, gy);
    ctx.closePath();
    ctx.fillStyle = isForest ? '#5a4a34' : '#454555';
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = isForest ? '#463824' : '#33333f';
    var dz = 0.16, off = (distance*0.03) % dz;
    for(var z=off; z<1.02; z+=dz){
      var yy = Math.round(yAt(z));
      var hw = halfWidthAt(z);
      ctx.lineWidth = Math.max(1, Math.round(2*scaleAt(z)));
      ctx.beginPath();
      ctx.moveTo(iW/2-hw, yy);
      ctx.lineTo(iW/2+hw, yy);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = isForest ? '#e8dcc0' : '#f4f4f4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(iW/2-topH,hy); ctx.lineTo(iW/2-botH,gy);
    ctx.moveTo(iW/2+topH,hy); ctx.lineTo(iW/2+botH,gy);
    ctx.stroke();

    ctx.setLineDash([6,5]);
    ctx.lineDashOffset = -(distance*0.9) % 11;
    ctx.strokeStyle = isForest ? 'rgba(232,220,192,0.6)' : 'rgba(244,244,244,0.6)';
    ctx.lineWidth = 1.5;
    [-0.5,0.5].forEach(function(l){
      ctx.beginPath();
      ctx.moveTo(laneCenterX(l,0),hy);
      ctx.lineTo(laneCenterX(l,1),gy);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function drawPole(p){
    var y = yAt(p.z), s = scaleAt(p.z);
    var edgeX = p.side<0 ? (iW/2 - halfWidthAt(p.z)) : (iW/2 + halfWidthAt(p.z));
    var h = iH*0.20*s;
    ctx.strokeStyle = '#8a8a9a';
    ctx.lineWidth = Math.max(1, 2*s);
    ctx.beginPath();
    ctx.moveTo(Math.round(edgeX), Math.round(y));
    ctx.lineTo(Math.round(edgeX), Math.round(y-h));
    ctx.stroke();
    var lampSize = Math.max(2, 4*s);
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(Math.round(edgeX-lampSize/2), Math.round(y-h-lampSize/2), Math.round(lampSize), Math.round(lampSize));
  }

  function drawTrain(o){
    var y = yAt(o.z), s = scaleAt(o.z), x = laneCenterX(o.lane,o.z);
    var w = laneWidthAt(o.z)*1.3, h = iH*0.42*s;
    drawGroundShadow(x, y, w*0.42, 0.28*s);
    var rx=Math.round(x-w/2), ry=Math.round(y-h), rw=Math.round(w), rh=Math.round(h);
    if(THEME === 'forest'){
      ctx.fillStyle = '#6b6a63';
      ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle = shadeColor('#6b6a63', 0.45);
      ctx.lineWidth = Math.max(1, Math.round(2*s));
      ctx.strokeRect(rx,ry,rw,rh);
      ctx.fillStyle = '#4a6b3a';
      ctx.fillRect(rx, ry, rw, Math.round(rh*0.22));
      ctx.fillStyle = '#55544c';
      ctx.fillRect(Math.round(rx+rw*0.15), Math.round(ry+rh*0.4), Math.round(rw*0.2), Math.round(rh*0.35));
      ctx.fillRect(Math.round(rx+rw*0.6), Math.round(ry+rh*0.5), Math.round(rw*0.18), Math.round(rh*0.3));
      return;
    }
    ctx.fillStyle = '#c8323a';
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeStyle = shadeColor('#c8323a', 0.45);
    ctx.lineWidth = Math.max(1, Math.round(2*s));
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.fillStyle = '#ffe9a8';
    var winW = rw*0.18, winH = rh*0.22, gap = rw*0.08;
    var startX = rx+rw*0.1;
    for(var wi=0; wi<3; wi++){
      ctx.fillRect(Math.round(startX+wi*(winW+gap)), Math.round(ry+rh*0.18), Math.round(winW), Math.round(winH));
    }
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(rx, Math.round(ry+rh*0.85), rw, Math.round(rh*0.15));
  }

  function drawBarrier(o){
    var y = yAt(o.z), s = scaleAt(o.z), x = laneCenterX(o.lane,o.z);
    var w = laneWidthAt(o.z)*1.05, h = iH*0.085*s;
    drawGroundShadow(x, y, w*0.42, 0.22*s);
    var rx=Math.round(x-w/2), ry=Math.round(y-h), rw=Math.round(w), rh=Math.round(h);
    if(THEME === 'forest'){
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle = shadeColor('#6b4a2c', 0.45);
      ctx.lineWidth = Math.max(1, Math.round(2*s));
      ctx.strokeRect(rx,ry,rw,rh);
      ctx.fillStyle = '#4a3018';
      var ringGap = Math.max(3, rw*0.16);
      for(var gx=rx+ringGap*0.5; gx<rx+rw; gx+=ringGap){
        ctx.fillRect(Math.round(gx), ry, 1, rh);
      }
      ctx.fillStyle = '#8a6440';
      ctx.fillRect(rx, ry, rw, Math.max(1,Math.round(rh*0.25)));
      return;
    }
    ctx.fillStyle = '#ffce54';
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeStyle = shadeColor('#ffce54', 0.45);
    ctx.lineWidth = Math.max(1, Math.round(2*s));
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.fillStyle = '#1a1a2e';
    var stripeW = Math.max(2, rw*0.12);
    for(var sx=rx; sx<rx+rw; sx+=stripeW*2){
      ctx.fillRect(Math.round(sx), ry, Math.round(stripeW), rh);
    }
  }

  function drawBeam(o){
    var y = yAt(o.z), s = scaleAt(o.z), x = laneCenterX(o.lane,o.z);
    var w = laneWidthAt(o.z)*1.05, barY = y - iH*0.28*s, barH = iH*0.05*s;
    drawGroundShadow(x, y, w*0.32, 0.18*s);
    var rx=Math.round(x-w/2), ry=Math.round(barY), rw=Math.round(w), rh=Math.round(barH);
    if(THEME === 'forest'){
      ctx.fillStyle = '#5a3d22';
      ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle = shadeColor('#5a3d22', 0.45);
      ctx.lineWidth = Math.max(1, Math.round(2*s));
      ctx.strokeRect(rx,ry,rw,rh);
      ctx.fillStyle = '#3f7a3a';
      var leafR = Math.max(2, rh*0.9);
      ctx.beginPath(); ctx.arc(rx+rw*0.2, ry, leafR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(rx+rw*0.55, ry-leafR*0.4, leafR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(rx+rw*0.85, ry, leafR, 0, Math.PI*2); ctx.fill();
      return;
    }
    ctx.fillStyle = '#3ca7e0';
    ctx.fillRect(rx,ry,rw,rh);
    ctx.strokeStyle = shadeColor('#3ca7e0', 0.45);
    ctx.lineWidth = Math.max(1, Math.round(2*s));
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.fillStyle = '#2b6f9e';
    var postW = Math.max(1, Math.round(3*s));
    ctx.fillRect(rx+2, ry+rh, postW, Math.round(y-(ry+rh)));
    ctx.fillRect(rx+rw-2-postW, ry+rh, postW, Math.round(y-(ry+rh)));
  }

  var POWERUP_COLORS = { shield:'#3ca7e0' };
  var POWERUP_LABELS = { shield:'S' };
  function drawPowerBadge(pu){
    var y = yAt(pu.z), s = scaleAt(pu.z), x = laneCenterX(pu.lane,pu.z);
    var size = Math.max(4, iH*0.045*s);
    var by = y - iH*0.06*s;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(Math.round(x-size/2-1), Math.round(by-size/2-1), Math.round(size+2), Math.round(size+2));
    ctx.fillStyle = POWERUP_COLORS[pu.type];
    ctx.fillRect(Math.round(x-size/2), Math.round(by-size/2), Math.round(size), Math.round(size));
    ctx.fillStyle = '#1a1a2e';
    ctx.font = Math.max(6,Math.round(size*0.55))+'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(POWERUP_LABELS[pu.type], Math.round(x), Math.round(by+1));
  }

  function drawPlayer(){
    if(invulnTimer>0 && Math.floor(performance.now()/90)%2===0) return;
    var x = laneCenterX(player.visualLane,1);
    var baseY = groundY() - iH*0.015;
    var jumpOffset = 0;
    if(player.jumping){
      var jp = player.jumpT/JUMP_DURATION;
      jumpOffset = -Math.sin(jp*Math.PI)*iH*0.17;
    }
    var bodyH = iH*0.13;
    if(player.sliding) bodyH *= 0.55;
    var bodyW = bodyH*0.62;
    drawGroundShadow(x, baseY, bodyW*0.85, 0.28);
    var y = baseY + jumpOffset;

    var running = !player.jumping && !player.sliding;
    var runAmp = running ? 3.2 : 1.2;
    var swing = Math.sin(runCycle) * runAmp;
    var bob = running ? Math.abs(Math.cos(runCycle)) * bodyH*0.05 : 0;

    var bw = bodyW, bh = bodyH*0.7;
    var bodyTop = -bodyH*0.85;

    ctx.save();
    ctx.translate(Math.round(x), Math.round(y - bob));

    if(!player.sliding){
      var legW = Math.max(2, bodyW*0.28), legH = bodyH*0.38;
      var legY = -legH*0.15;
      ctx.fillStyle = '#26263a';
      ctx.fillRect(Math.round(-bodyW*0.28+swing), Math.round(legY), Math.round(legW), Math.round(legH));
      ctx.fillRect(Math.round(bodyW*0.28-swing-legW), Math.round(legY), Math.round(legW), Math.round(legH));
      ctx.fillStyle = '#15151f';
      ctx.fillRect(Math.round(-bodyW*0.28+swing), Math.round(legY+legH-2), Math.round(legW), 2);
      ctx.fillRect(Math.round(bodyW*0.28-swing-legW), Math.round(legY+legH-2), Math.round(legW), 2);

      var armW = Math.max(2, bodyW*0.24);
      var armSwing = swing * 0.9;
      var armTopY = player.jumping ? bodyTop - bodyH*0.15 : bodyTop + bh*0.05;
      var armLen = (player.jumping ? bodyH*0.45 : bodyH*0.6);
      ctx.fillStyle = '#15151f';
      ctx.fillRect(Math.round(-bw*0.62 - armSwing), Math.round(armTopY), Math.round(armW), Math.round(armLen));
      ctx.fillRect(Math.round(bw*0.62 + armSwing - armW), Math.round(armTopY), Math.round(armW), Math.round(armLen));
      ctx.fillStyle = '#e8a978';
      ctx.fillRect(Math.round(-bw*0.62 - armSwing), Math.round(armTopY+armLen-2), Math.round(armW), 2);
      ctx.fillRect(Math.round(bw*0.62 + armSwing - armW), Math.round(armTopY+armLen-2), Math.round(armW), 2);
    }

    // back panel of the jacket (we're viewing him from behind, running away up the track)
    var jacketGrad = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
    jacketGrad.addColorStop(0, '#a855f7');
    jacketGrad.addColorStop(1, '#2dd4bf');
    ctx.fillStyle = jacketGrad;
    ctx.fillRect(Math.round(-bw/2), Math.round(bodyTop), Math.round(bw), Math.round(bh));

    ctx.strokeStyle = shadeColor('#6b3fa0', 0.5);
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(-bw/2), Math.round(bodyTop), Math.round(bw), Math.round(bh));

    // back of the head - beanie covers almost all of it, just a hint of neck below
    var headSize = bodyW*0.95;
    var headTop = bodyTop - headSize*0.75;
    ctx.fillStyle = '#e8a978';
    ctx.fillRect(Math.round(-headSize/2), Math.round(headTop), Math.round(headSize), Math.round(headSize*0.9));
    ctx.fillStyle = '#15151f';
    ctx.fillRect(Math.round(-headSize/2-1), Math.round(headTop-1), Math.round(headSize+2), Math.round(headSize*0.8));

    ctx.restore();
  }

  function drawFloatingBoss(){
    var bt = BOSS_TYPES[bossTypeIndex];
    var x = laneCenterX(bossLaneVisual, 1);
    var baseY = groundY() - iH*0.015;
    var hoverY = baseY - iH*0.36 + Math.sin(performance.now()/260)*2;
    var bodyH = iH*0.13;
    var bodyW = bodyH*0.62;
    drawGroundShadow(x, baseY, bodyW*0.85, 0.28);

    ctx.save();
    ctx.translate(Math.round(x), Math.round(hoverY));

    if(bossPhase==='charging'){
      var glowPulse = 0.55+0.35*Math.sin(performance.now()/90);
      ctx.fillStyle = 'rgba(255,80,80,'+(0.3*glowPulse).toFixed(2)+')';
      ctx.beginPath();
      ctx.arc(0, bodyH*0.55, Math.max(2, bodyW*0.9*glowPulse), 0, Math.PI*2);
      ctx.fill();
    }

    var hw = bodyW, hh = bodyH*0.75;
    ctx.fillStyle = bt.thruster;
    ctx.fillRect(Math.round(-hw*0.78), Math.round(-hh*0.08), Math.round(hw*0.22), Math.round(hh*0.5));
    ctx.fillRect(Math.round(hw*0.56), Math.round(-hh*0.08), Math.round(hw*0.22), Math.round(hh*0.5));

    ctx.fillStyle = bt.hull;
    ctx.fillRect(Math.round(-hw/2), Math.round(-hh/2), Math.round(hw), Math.round(hh));
    ctx.strokeStyle = shadeColor(bt.hull, 0.55);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(Math.round(-hw/2), Math.round(-hh/2), Math.round(hw), Math.round(hh));

    var eyeGlow = 0.6+0.4*Math.sin(performance.now()/200);
    ctx.fillStyle = bt.eye+eyeGlow.toFixed(2)+')';
    var eyeW = hw*0.4, eyeH = hh*0.28;
    if(bt.beamCount>1){
      ctx.fillRect(Math.round(-hw*0.38), Math.round(-hh*0.12), Math.round(eyeW*0.55), Math.round(eyeH));
      ctx.fillRect(Math.round(hw*0.38-eyeW*0.55), Math.round(-hh*0.12), Math.round(eyeW*0.55), Math.round(eyeH));
    } else {
      ctx.fillRect(Math.round(-eyeW/2), Math.round(-hh*0.12), Math.round(eyeW), Math.round(eyeH));
    }

    ctx.restore();
  }

  function drawBossAttack(){
    if(bossPhase==='charging'){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,70,70,0.85)';
      ctx.lineWidth = 2;
      bossTargetLanes.forEach(function(lane){
        var gx = laneCenterX(lane, 1);
        var pulse = 0.65+0.35*Math.sin(performance.now()/90);
        var ringR = iH*0.028*pulse;
        ctx.beginPath();
        ctx.arc(gx, groundY()-4, Math.max(2,ringR), 0, Math.PI*2);
        ctx.stroke();
      });
      ctx.restore();
    } else if(bossPhase==='firing'){
      var topY = groundY() - iH*0.36;
      var botY = groundY();
      var w = Math.max(3, iH*0.05);
      var alpha = Math.min(1, bossPhaseTimer/0.16);
      ctx.save();
      ctx.globalAlpha = alpha;
      bossBeamLanes.forEach(function(lane){
        var x = laneCenterX(lane, 1);
        ctx.fillStyle = bossBeamColor;
        ctx.fillRect(Math.round(x-w*0.7), Math.round(topY), Math.round(w*1.4), Math.round(botY-topY));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(x-w*0.35), Math.round(topY), Math.round(w*0.7), Math.round(botY-topY));
      });
      ctx.restore();
    }
  }

  function drawParticles(){
    particles.forEach(function(p){
      var a = Math.max(0, p.life/p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x-2), Math.round(p.y-2), 4, 4);
      ctx.globalAlpha = 1;
    });
  }

  function render(){
    ctx.clearRect(0,0,iW,iH);
    drawSky();
    drawRoad();
    if(endingActive){
      var endingProgress = 1 - Math.max(0,endingTimer)/ENDING_DURATION;
      var hy = horizonY();
      var cx = iW/2, cy = hy*0.7;
      var maxR = Math.max(iW,iH)*0.85;
      var r = Math.max(4, maxR*endingProgress);
      var glowGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      glowGrad.addColorStop(0, 'rgba(255,250,225,'+(0.85*endingProgress).toFixed(2)+')');
      glowGrad.addColorStop(0.55, 'rgba(255,222,150,'+(0.45*endingProgress).toFixed(2)+')');
      glowGrad.addColorStop(1, 'rgba(255,222,150,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0,0,iW,iH);
    }

    var entities = [];
    poles.forEach(function(p){ entities.push({z:p.z, draw:function(){drawPole(p);}}); });
    obstacles.forEach(function(o){ entities.push({z:o.z, draw:function(){
      if(o.type==='train') drawTrain(o);
      else if(o.type==='barrier') drawBarrier(o);
      else drawBeam(o);
    }}); });
    powerUps.forEach(function(pu){ if(!pu.collected) entities.push({z:pu.z, draw:function(){drawPowerBadge(pu);}}); });

    entities.sort(function(a,b){ return a.z-b.z; });
    entities.forEach(function(e){ e.draw(); });

    if(state==='playing' || state==='ended') drawPlayer();
    if(bossActive){
      drawBossAttack();
      drawFloatingBoss();
    }
    drawParticles();

    if(bossWarningTimer>0){
      if(Math.sin(performance.now()/120)>0){
        ctx.save();
        ctx.font = 'bold ' + Math.round(iH*0.05) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1a1a2e';
        ctx.fillStyle = '#e4423f';
        var wy = horizonY()*0.5;
        ctx.strokeText(bossWarningLabel, iW/2, wy);
        ctx.fillText(bossWarningLabel, iW/2, wy);
        ctx.restore();
      }
      if(bossTaunt){
        ctx.save();
        ctx.font = Math.round(iH*0.028) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1a1a2e';
        ctx.fillStyle = '#f4f4f4';
        var ty2 = horizonY()*0.5 + iH*0.075;
        ctx.strokeText(bossTaunt, iW/2, ty2);
        ctx.fillText(bossTaunt, iW/2, ty2);
        ctx.restore();
      }
    }

    if(bossDefeatFlashTimer>0){
      ctx.save();
      ctx.globalAlpha = Math.min(1, bossDefeatFlashTimer*1.2);
      ctx.font = 'bold ' + Math.round(iH*0.07) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1a1a2e';
      ctx.fillStyle = '#ffe066';
      var dy = horizonY()*0.5;
      ctx.strokeText('BOSS DEFEATED!', iW/2, dy);
      ctx.fillText('BOSS DEFEATED!', iW/2, dy);
      ctx.restore();
    }

    if(flashAlpha>0){
      ctx.fillStyle = 'rgba(210,225,255,'+flashAlpha.toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }

    if(hitFlashAlpha>0){
      ctx.fillStyle = 'rgba(228,66,63,'+hitFlashAlpha.toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }

    if(endingActive && endingTimer < 2){
      var whiteout = 1 - Math.max(0,endingTimer)/2;
      ctx.fillStyle = 'rgba(255,250,235,'+(whiteout*0.9).toFixed(2)+')';
      ctx.fillRect(0,0,iW,iH);
    }
  }

  // ---------- Loop ----------
  var lastTime = null;
  function loop(ts){
    if(lastTime===null) lastTime = ts;
    var dt = (ts-lastTime)/1000;
    lastTime = ts;
    dt = Math.min(dt, 0.05);
    cloudT += dt;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
